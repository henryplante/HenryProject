server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful

spring:
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clearpath}
    username: ${SPRING_DATASOURCE_USERNAME:clearpath}
    password: ${SPRING_DATASOURCE_PASSWORD:clearpath}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    fail-on-missing-locations: false
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 30s

clearpath:
  session:
    secret: ${SESSION_SECRET:dev-change-me-in-production}
    cookie-name: clearpath_session
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
