services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: clearpath
      POSTGRES_USER: clearpath
      POSTGRES_PASSWORD: clearpath
    ports:
      - "5432:5432"
    volumes:
      - clearpath_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearpath -d clearpath"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  clearpath_pg_data:
